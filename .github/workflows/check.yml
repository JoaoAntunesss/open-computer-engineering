name: Verificar exercícios
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Testes do corretor e de todos os exercícios
        run: |
          pip install pytest
          pytest -v
      - name: js/lessons.js corresponde às lições em conteudo/
        run: |
          node scripts/build-lessons.mjs
          git diff --exit-code js/lessons.js || (echo "Corre 'node scripts/build-lessons.mjs' e faz commit de js/lessons.js" && exit 1)
      - name: O JavaScript não tem erros de sintaxe
        run: for f in js/app.js js/exercicios.js js/py-worker.js; do node --check "$f"; done
